name: Release Build

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-build-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            artifact_name: macos
          - os: ubuntu-22.04
            label: Linux
            artifact_name: linux
          - os: windows-latest
            label: Windows
            artifact_name: windows

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop installers
        run: pnpm desktop:dist

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.artifact_name }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          mapfile -t ARTIFACTS < <(find release-artifacts -type f | sort)

          if [ "${#ARTIFACTS[@]}" -eq 0 ]; then
            echo "No release assets were downloaded."
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${ARTIFACTS[@]}" --clobber
            exit 0
          fi

          gh release create "$TAG_NAME" "${ARTIFACTS[@]}" \
            --title "AmberKeeper $TAG_NAME" \
            --generate-notes
